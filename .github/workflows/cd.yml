name: CD

on:
  push:
    branches: [main]

jobs:
  cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ia-seguros-portal:latest .

      - name: Save image
        run: docker save ia-seguros-portal:latest > /tmp/ia-seguros-portal.tar

      - name: Transfer image to dockeroxi
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 192.168.10.66
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "/tmp/ia-seguros-portal.tar"
          target: "/tmp/"

      - name: Deploy on dockeroxi
        uses: appleboy/ssh-action@v1
        with:
          host: 192.168.10.66
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p /opt/ia-seguros-portal/
            docker load < /tmp/ia-seguros-portal.tar
            docker compose -f /opt/ia-seguros-portal/docker-compose.yml up -d
