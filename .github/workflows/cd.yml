name: CD

on:
  push:
    branches: [main]

jobs:
  cd:
    runs-on: ubuntu-latest
    if: github.repository == 'zzp4yv/ia-seguros-portal'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/zzp4yv/ia-seguros-portal:latest

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: 192.168.10.66
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/ia-seguros-portal/
            docker pull ghcr.io/zzp4yv/ia-seguros-portal:latest
            docker compose up -d
