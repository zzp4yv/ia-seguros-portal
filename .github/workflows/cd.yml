name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  cd:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to dockeroxi
        uses: appleboy/ssh-action@v1
        with:
          host: 192.168.10.66
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            rm -rf /opt/ia-seguros-portal/
            mkdir -p /opt/ia-seguros-portal/
            cd /opt/ia-seguros-portal/

      - name: Upload code via scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 192.168.10.66
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "*"
          target: "/opt/ia-seguros-portal/"
          rm: true
          exclude: ".github,.git,.vscode,node_modules,.next"

      - name: Build and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: 192.168.10.66
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/ia-seguros-portal/
            docker compose up -d --build
