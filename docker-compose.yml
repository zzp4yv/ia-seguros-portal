services:
  ia-seguros-portal:
    image: ia-seguros-portal:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=https://ia-seguros.oxigenio.online
    ports:
      - "3001:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SITE_URL=https://ia-seguros.oxigenio.online
